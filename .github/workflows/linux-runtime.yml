name: Linux runtime

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-18 libomp-18-dev ninja-build
      - name: Build, drive, capture linkage, and clean owned build
        run: bash scripts/verify-openmp-runtime.sh all
        env:
          LOMP_VERIFY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify failed-run cleanup and evidence retention
        shell: bash
        run: |
          set +e
          bash scripts/verify-openmp-runtime.sh negative-control
          status=$?
          set -e
          test "$status" -ne 0
          result="artifacts/native-runs/${LOMP_VERIFY_RUN_ID}/result.json"
          test -f "$result"
          grep -F '"passed":false' "$result"
          grep -F '"cleanup_succeeded":true' "$result"
          grep -F '"injected_failure":true' "$result"
          test -f "artifacts/native-runs/${LOMP_VERIFY_RUN_ID}/injected-failure.log"
          test ! -e "build/verify-openmp-runtime/${LOMP_VERIFY_RUN_ID}"
        env:
          LOMP_VERIFY_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-negative
      - name: Retain runtime verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openmp-runtime-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/native-runs/${{ github.run_id }}-${{ github.run_attempt }}*/
          if-no-files-found: warn
